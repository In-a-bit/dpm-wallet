services:
  # Migrations run from the image's CMD, before the service starts — see the Dockerfile.
  dpm-wallet:
    build: .
    ports: ["8090:8090"]
    env_file: .env
    # Mount the directory, not the file: WAL mode writes dpm-wallet.sqlite-wal and -shm beside
    # the database, and SQLite recovery may recreate them. The plaintext api-key-pair.plaintext.json
    # backup (see src/vault/api-key-pair-plaintext-backup.ts) lands here too, for the same reason.
    # Keep the volume on local disk — SQLite's POSIX advisory locking is unreliable over
    # NFS/SMB and can silently corrupt the file.
    volumes: ["dpm-wallet-data:/data"]
    restart: unless-stopped
    # Let in-flight signing finish and the WAL checkpoint run.
    stop_grace_period: 30s
    # SQLite permits one writer per database file — never scale this beyond a single replica.
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # Survives `down`; destroyed only by `down -v`.
  dpm-wallet-data:
