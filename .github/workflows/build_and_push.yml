name: Build and Publish Image

# Publishes the public image to GHCR from GitHub-hosted runners. This repo is public:
# anyone can open a PR, so nothing here may run on the self-hosted fast-gke runner,
# and a PR build never logs in or pushes.
#
# Tags:
#   push to dev / stage / main   → :<branch>, :sha-<short>
#   git tag v1.2.3               → :1.2.3, :1.2, :latest, :sha-<short>
#   pull request                 → built only, nothing pushed

on:
  push:
    branches: ["main", "stage", "dev", "release/**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/in-a-bit/dpm-wallet

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'NOBUILD') }}
    runs-on: ubuntu-latest
    # The one job that pushes an image. A pull request never does (and never gets a write token
    # from a fork anyway); a manual run publishes only from the branches and tags released from.
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: >-
        ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (
        github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage' ||
        github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/') ||
        startsWith(github.ref, 'refs/tags/v'))) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
